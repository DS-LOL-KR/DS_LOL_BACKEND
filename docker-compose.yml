services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ds_lol_dev}
    volumes:
      - db_data:/var/lib/postgresql/data
    # 호스트(로컬 맥북)에서도 5432로 이 DB에 붙을 수 있게 포트를 열어둠.
    # 이게 있어야 컨테이너 밖(호스트)에서 `npx prisma migrate dev`를 돌릴 수 있음 —
    # 그때 쓰는 .env의 DATABASE_URL이 localhost:5432를 가리키고 있기 때문.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # db 서비스는 도커 내부 네트워크에서 호스트명 "db"로 접근해야 하므로,
      # .env에 적힌 localhost 기준 DATABASE_URL을 여기서 덮어씀.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ds_lol_dev}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-4000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
